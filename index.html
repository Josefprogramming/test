<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Message</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, WHITE, GRAY, WHITE);
            font-family: Arial, sans-serif;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 48px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
       input {
    margin-top: 30px;
    width: 200px;
    height: 50px;
    font-size: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    box-sizing: border-box;
    text-align: center;
}

button {
    margin-top: 25px;
    width: 70px;
    height: 30px;
    font-size: 10px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}
    </style>
</head>
<body>
    <h1 id="text"></h1>
    <input type="text" id="response" placeholder="Write Yes or No...">
    <button onclick="submitResponse()">Send</button>
    
  <script>
const text = "IT'S SUNNY! WE ARE GOING OUT!";
const container = document.getElementById("text");

function createFlyingText() {

    container.innerHTML = "";

    // Vytvoříme celý text jako jednotlivá písmena
    text.split("").forEach((char, index) => {

        const span = document.createElement("span");

        span.textContent = char === " " ? "\u00A0" : char;

        span.style.display = "inline-block";
        span.style.fontSize = "clamp(28px, 5vw, 48px)";
        span.style.fontWeight = "bold";

        // Písmeno začíná 100vh nad svou výslednou pozicí
        span.style.transform = "translateY(-100vh) rotate(" +
            (Math.random() * 40 - 20) + "deg)";

        span.style.opacity = "0";

        span.style.transition =
            "transform 1s cubic-bezier(.2,.8,.3,1), " +
            "opacity 0.3s ease";

        container.appendChild(span);

        // Každé písmeno začne padat postupně
        setTimeout(() => {

            span.style.opacity = "1";
            span.style.transform = "translateY(0) rotate(0deg)";

        }, index * 80);
    });

    // Zobrazení celého textového kontejneru
    container.style.opacity = "1";
}


// YES / NO
function submitResponse() {

    let response = document
        .getElementById("response")
        .value
        .trim()
        .toLowerCase();

    localStorage.setItem("userResponse", response);

    if (response === "yes") {
        window.location.href = "response.html";
    }

    else if (response === "no") {
        window.location.href = "response2.html";
    }

    else {
        alert("Please type Yes or No.");
    }
}


window.onload = createFlyingText;
</script>
